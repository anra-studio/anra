syntax = "proto3";

package anra.peer.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/scbizu/anra/gen/anra/peer/v1;peerv1";

// Peer is an identified agent. Its address and skills survive lost contact.
message Peer {
  string id = 1 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    max_bytes: 128
  }];
  string description = 2;
  string address = 3 [(buf.validate.field).string.min_bytes = 1];
  repeated Skill skill = 4;
}

message Skill {
  string id = 1 [(buf.validate.field).string.min_bytes = 1];
  string name = 2 [(buf.validate.field).string.pattern = "\\S"];
  string description = 3;
}
