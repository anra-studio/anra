syntax = "proto3";

package anra.model.view.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/anra-studio/anra/gen/anra/model/view/v1;viewv1";

message Source {
  string agent_id = 1 [(buf.validate.field).string.min_bytes = 1];
  string tape_id = 2 [(buf.validate.field).string.min_bytes = 1];
}

// Ranges are half-open and use arbitrary-precision canonical decimal sequences.
message EntryRange {
  option (buf.validate.message).cel = {
    id: "entry_range.ordered"
    message: "seq_s must precede seq_e"
    expression: "size(this.seq_s) < size(this.seq_e) || (size(this.seq_s) == size(this.seq_e) && this.seq_s < this.seq_e)"
  };
  string seq_s = 1 [(buf.validate.field).string.pattern = "^[1-9][0-9]*$"];
  string seq_e = 2 [(buf.validate.field).string.pattern = "^[1-9][0-9]*$"];
}

// Ref identifies committed scopes and carries no authorization or derived end.
message Ref {
  Source source = 1 [(buf.validate.field).required = true];
  repeated EntryRange scopes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message Lease {
  string id = 1 [(buf.validate.field).string.min_bytes = 1];
  string caller = 2 [(buf.validate.field).string.min_bytes = 1];
  Ref ref = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp expires_at = 4 [(buf.validate.field).required = true];
}

enum DecisionStatus {
  DECISION_STATUS_UNSPECIFIED = 0;
  DECISION_STATUS_GRANTED = 1;
  DECISION_STATUS_DENIED = 2;
  DECISION_STATUS_PENDING = 3;
}

message Decision {
  option (buf.validate.message).cel = {
    id: "decision.lease_presence"
    message: "lease must be present exactly when status is granted"
    expression: "(this.status == 1) == has(this.lease)"
  };
  string request_id = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
  DecisionStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Lease lease = 3;
}

message BorrowRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
  string purpose = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 8192
  }];
  string query = 3 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 8192
  }];
  EntryRange bounds = 4;
  Ref view = 5;
}

// Payload preserves exact JSON without numeric coercion.
message Payload {
  string media_type = 1 [(buf.validate.field).string.min_bytes = 1];
  bytes json_data = 2 [(buf.validate.field).bytes.min_len = 1];
}

message ExportedEntry {
  string seq = 1 [(buf.validate.field).string.pattern = "^[1-9][0-9]*$"];
  string kind = 2;
  google.protobuf.Timestamp timestamp = 3 [(buf.validate.field).required = true];
  Payload payload = 4 [(buf.validate.field).required = true];
}

message Provenance {
  string caller = 1 [(buf.validate.field).string.min_bytes = 1];
  string lease_id = 2 [(buf.validate.field).string.min_bytes = 1];
  Ref ref = 3 [(buf.validate.field).required = true];
}

message Quote {
  string channel = 1 [(buf.validate.field).string.const = "borrowed"];
  Provenance provenance = 2 [(buf.validate.field).required = true];
  repeated ExportedEntry entries = 3;
  string next_cursor = 4;
}
