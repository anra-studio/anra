syntax = "proto3";
package anra.a2a.tape.v1;

import "anra/model/view/v1/view.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/anra-studio/anra/gen/anra/a2a/tape/v1;tapev1";

service TapeViewService {
  rpc Borrow(anra.model.view.v1.BorrowRequest) returns (BorrowResponse) {
    option (google.api.http) = {
      post: "/v1/tape/borrows"
      body: "*"
    };
  }
  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {get: "/v1/tape/borrows/{request_id}"};
  }
  rpc Read(ReadRequest) returns (ReadResponse) {
    option (google.api.http) = {get: "/v1/tape/views/{lease_id}/entries"};
  }
  rpc Release(ReleaseRequest) returns (ReleaseResponse) {
    option (google.api.http) = {
      post: "/v1/tape/views/{lease_id}:release"
      body: "*"
    };
  }
}
message BorrowResponse {
  anra.model.view.v1.Decision decision = 1 [(buf.validate.field).required = true];
}
message GetRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
}
message GetResponse {
  anra.model.view.v1.Decision decision = 1 [(buf.validate.field).required = true];
}
message ReadRequest {
  string lease_id = 1 [(buf.validate.field).string.min_bytes = 1];
  // Opaque continuation is decoded and bounded by the view service.
  string cursor = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}
message ReadResponse {
  anra.model.view.v1.Quote quote = 1 [(buf.validate.field).required = true];
  string next_cursor = 2;
}
message ReleaseRequest {
  string lease_id = 1 [(buf.validate.field).string.min_bytes = 1];
}
message ReleaseResponse {
  bool released = 1;
}
